
name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - template-boda

  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - template-boda

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Deploy Prebuilt Static Web App

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Deploy prebuilt Angular
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_STONE_0220C9F10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}

          action: "upload"

          # El sitio compilado está directamente en la raíz del repo.
          app_location: "/"

          # No hay Azure Functions dentro de este Static Web App.
          api_location: ""

          # NO ejecutar npm install ni ng build.
          skip_app_build: true

          # app_location ya contiene los archivos finales.
          output_location: ""

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job

    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_STONE_0220C9F10 }}
          action: "close"
