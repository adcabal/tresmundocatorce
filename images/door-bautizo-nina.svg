<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="roseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fce7f3" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#fbcfe8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGradNina" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="45%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="60%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
  </defs>

  <!-- Aura floral rosa y cálida -->
  <circle cx="300" cy="400" r="185" fill="url(#roseGlow)"/>

  <!-- Anillo exterior con diseño de corona -->
  <circle cx="300" cy="400" r="145" fill="none" stroke="url(#goldGradNina)" stroke-width="2.5"/>
  <circle cx="300" cy="400" r="135" fill="none" stroke="url(#goldGradNina)" stroke-width="1.2" stroke-dasharray="3 5"/>
  <circle cx="300" cy="400" r="126" fill="none" stroke="url(#goldGradNina)" stroke-width="1"/>

  <!-- Flores y ramitas ornamentales alrededor de la corona -->
  <!-- Flores superiores -->
  <g fill="url(#roseGrad)" opacity="0.85">
    <!-- Flor a las 11 en punto -->
    <circle cx="215" cy="295" r="9"/>
    <circle cx="205" cy="290" r="7" opacity="0.7"/>
    <circle cx="210" cy="305" r="7" opacity="0.7"/>
    <circle cx="225" cy="300" r="7" opacity="0.7"/>
    <circle cx="215" cy="295" r="3" fill="#fde68a"/>

    <!-- Flor a la 1 en punto -->
    <circle cx="385" cy="295" r="9"/>
    <circle cx="395" cy="290" r="7" opacity="0.7"/>
    <circle cx="390" cy="305" r="7" opacity="0.7"/>
    <circle cx="375" cy="300" r="7" opacity="0.7"/>
    <circle cx="385" cy="295" r="3" fill="#fde68a"/>

    <!-- Flor a las 9 en punto -->
    <circle cx="155" cy="400" r="11"/>
    <circle cx="145" cy="392" r="8" opacity="0.7"/>
    <circle cx="145" cy="408" r="8" opacity="0.7"/>
    <circle cx="162" cy="392" r="8" opacity="0.7"/>
    <circle cx="162" cy="408" r="8" opacity="0.7"/>
    <circle cx="155" cy="400" r="4" fill="#fde68a"/>

    <!-- Flor a las 3 en punto -->
    <circle cx="445" cy="400" r="11"/>
    <circle cx="455" cy="392" r="8" opacity="0.7"/>
    <circle cx="455" cy="408" r="8" opacity="0.7"/>
    <circle cx="438" cy="392" r="8" opacity="0.7"/>
    <circle cx="438" cy="408" r="8" opacity="0.7"/>
    <circle cx="445" cy="400" r="4" fill="#fde68a"/>

    <!-- Flor inferior central -->
    <circle cx="300" cy="535" r="12"/>
    <circle cx="288" cy="530" r="9" opacity="0.7"/>
    <circle cx="312" cy="530" r="9" opacity="0.7"/>
    <circle cx="292" cy="544" r="9" opacity="0.7"/>
    <circle cx="308" cy="544" r="9" opacity="0.7"/>
    <circle cx="300" cy="535" r="4" fill="#fde68a"/>
  </g>

  <!-- Hojitas verdes/doradas -->
  <g fill="#d97706" opacity="0.6">
    <path d="M230 280 C238 275 248 278 250 285 C242 288 232 286 230 280 Z"/>
    <path d="M370 280 C362 275 352 278 350 285 C358 288 368 286 370 280 Z"/>
    <path d="M170 425 C172 435 168 444 162 448 C160 438 164 430 170 425 Z"/>
    <path d="M430 425 C428 435 432 444 438 448 C440 438 436 430 430 425 Z"/>
  </g>

  <!-- Paloma del Espíritu Santo arriba -->
  <g transform="translate(300, 310) scale(0.85)" fill="url(#goldGradNina)">
    <path d="M0 -22 C-6 -22 -14 -16 -18 -8 C-24 -4 -30 -1 -38 -3 C-34 5 -26 10 -16 10 C-12 16 -6 22 0 26 C6 22 12 16 16 10 C26 10 34 5 38 -3 C30 -1 24 -4 18 -8 C14 -16 6 -22 0 -22 Z" opacity="0.95"/>
    <path d="M-4 12 C-8 14 -12 13 -14 10 C-10 9 -6 10 -4 12 Z" fill="#f472b6"/>
    <path d="M4 12 C8 14 12 13 14 10 C10 9 6 10 4 12 Z" fill="#f472b6"/>
  </g>

  <!-- Cruz Central -->
  <g transform="translate(300, 415)" fill="url(#goldGradNina)" filter="drop-shadow(0 2px 8px rgba(190,24,93,0.3))">
    <rect x="-8" y="-68" width="16" height="132" rx="4"/>
    <rect x="-44" y="-40" width="88" height="16" rx="4"/>
    <polygon points="0,-74 -11,-68 11,-68"/>
    <polygon points="0,69 -11,64 11,64"/>
    <polygon points="-49,-32 -44,-43 -44,-21"/>
    <polygon points="49,-32 44,-43 44,-21"/>
    <polygon points="0,-36 6,-32 0,-28 -6,-32" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Destellos dorados y rosados -->
  <g fill="#d97706" opacity="0.8">
    <polygon points="300,215 302,221 307,222 302,224 300,230 298,224 293,222 298,221" />
    <polygon points="300,580 302,586 307,587 302,589 300,595 298,589 293,587 298,586" />
    <polygon points="125,400 127,406 132,407 127,409 125,415 123,409 118,407 123,406" />
    <polygon points="475,400 477,406 482,407 477,409 475,415 473,409 468,407 473,406" />
  </g>
</svg>
