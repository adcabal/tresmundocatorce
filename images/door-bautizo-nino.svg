<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Aura central -->
  <circle cx="300" cy="400" r="180" fill="url(#goldGlow)"/>

  <!-- Anillo exterior ornamental -->
  <circle cx="300" cy="400" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="4 6"/>
  <circle cx="300" cy="400" r="130" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="300" cy="400" r="122" fill="none" stroke="url(#goldGrad)" stroke-width="1"/>

  <!-- Rayos celestiales -->
  <g stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6">
    <line x1="300" y1="230" x2="300" y2="255"/>
    <line x1="300" y1="545" x2="300" y2="570"/>
    <line x1="130" y1="400" x2="155" y2="400"/>
    <line x1="645" y1="400" x2="670" y2="400"/>
    <line x1="180" y1="280" x2="200" y2="300"/>
    <line x1="420" y1="280" x2="400" y2="300"/>
    <line x1="180" y1="520" x2="200" y2="500"/>
    <line x1="420" y1="520" x2="400" y2="500"/>
  </g>

  <!-- Paloma del Espíritu Santo arriba de la cruz -->
  <g transform="translate(300, 315) scale(0.9)" fill="url(#goldGrad)">
    <!-- Cuerpo y alas de paloma -->
    <path d="M0 -22 C-6 -22 -14 -16 -18 -8 C-24 -4 -30 -1 -38 -3 C-34 5 -26 10 -16 10 C-12 16 -6 22 0 26 C6 22 12 16 16 10 C26 10 34 5 38 -3 C30 -1 24 -4 18 -8 C14 -16 6 -22 0 -22 Z" opacity="0.95"/>
    <!-- Ramita de olivo -->
    <path d="M-4 12 C-8 14 -12 13 -14 10 C-10 9 -6 10 -4 12 Z" fill="#38bdf8"/>
    <path d="M4 12 C8 14 12 13 14 10 C10 9 6 10 4 12 Z" fill="#38bdf8"/>
  </g>

  <!-- Cruz Central -->
  <g transform="translate(300, 420)" fill="url(#goldGrad)" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.25))">
    <!-- Poste vertical -->
    <rect x="-9" y="-70" width="18" height="135" rx="4"/>
    <!-- Brazo horizontal -->
    <rect x="-46" y="-42" width="92" height="18" rx="4"/>
    <!-- Remates ornamentales -->
    <polygon points="0,-76 -12,-70 12,-70"/>
    <polygon points="0,71 -12,65 12,65"/>
    <polygon points="-52,-33 -46,-45 -46,-21"/>
    <polygon points="52,-33 46,-45 46,-21"/>
    <!-- Centro diamante -->
    <polygon points="0,-38 7,-33 0,-28 -7,-33" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Estrellitas decorativas -->
  <g fill="#d97706" opacity="0.85">
    <polygon points="300,210 302,216 308,218 302,220 300,226 298,220 292,218 298,216" />
    <polygon points="300,580 302,586 308,588 302,590 300,596 298,590 292,588 298,586" />
    <polygon points="120,400 122,406 128,408 122,410 120,416 118,410 112,408 118,406" />
    <polygon points="480,400 482,406 488,408 482,410 480,416 478,410 472,408 478,406" />
  </g>

  <!-- Nubes de base celestial -->
  <g fill="#e0f2fe" opacity="0.35">
    <ellipse cx="250" cy="560" rx="90" ry="24"/>
    <ellipse cx="350" cy="560" rx="90" ry="24"/>
    <ellipse cx="300" cy="550" rx="120" ry="30"/>
  </g>
</svg>
